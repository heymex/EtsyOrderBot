# OrderBot behind Traefik (same pattern as stacks/vikunja, manyfold, etc.):
# - external Docker network `proxy` where Traefik listens
# - websecure + TLS via Cloudflare DNS (certresolver `cf` — override if you use another resolver)
#
# Set ORDERBOT_DOMAIN to the hostname you expose (no scheme). ETSY_REDIRECT_URI must use
# the same host, e.g. https://${ORDERBOT_DOMAIN}/callback

services:
  orderbot:
    image: ghcr.io/heymex/etsyorderbot:${ORDERBOT_IMAGE_TAG:-latest}
    container_name: orderbot
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=${ORDERBOT_PORT:-3000}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - ETSY_API_KEY=${ETSY_API_KEY:?set ETSY_API_KEY in .env}
      - ETSY_SHARED_SECRET=${ETSY_SHARED_SECRET:?set ETSY_SHARED_SECRET in .env}
      - ETSY_REDIRECT_URI=${ETSY_REDIRECT_URI:?set ETSY_REDIRECT_URI in .env}
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
      - NOTIFICATION_WEBHOOK_URL=${NOTIFICATION_WEBHOOK_URL:?set NOTIFICATION_WEBHOOK_URL in .env}
      - NOTIFICATION_WEBHOOK_SECRET=${NOTIFICATION_WEBHOOK_SECRET:-}
      - ETSY_MONITOR_INTERVAL_SECONDS=${ETSY_MONITOR_INTERVAL_SECONDS:-300}
      - ETSY_REMINDER_HOURS=${ETSY_REMINDER_HOURS:-6}
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-15}
    volumes:
      - orderbot-data:/app/.data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orderbot.rule=Host(`${ORDERBOT_DOMAIN:?set ORDERBOT_DOMAIN in .env}`)"
      - "traefik.http.routers.orderbot.entrypoints=websecure"
      - "traefik.http.routers.orderbot.tls.certresolver=${ORDERBOT_CERT_RESOLVER:-cf}"
      - "traefik.http.middlewares.orderbot-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.orderbot-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.orderbot-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.orderbot-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.orderbot-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.orderbot-headers.headers.contentTypeNosniff=true"
      - "traefik.http.routers.orderbot.middlewares=orderbot-headers@docker"
      - "traefik.http.services.orderbot.loadbalancer.server.port=${ORDERBOT_PORT:-3000}"

volumes:
  orderbot-data:
    name: orderbot-data

networks:
  proxy:
    external: true
